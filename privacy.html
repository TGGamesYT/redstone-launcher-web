<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy — Redstone Launcher</title>
    <meta name="description"
        content="What Redstone Launcher does with your data, and what it does not. Cloud syncing is optional and off until you turn it on.">
    <meta name="author" content="Redstone Launcher Team">
    <meta property="og:title" content="Privacy Policy — Redstone Launcher">
    <meta property="og:description" content="What Redstone Launcher does with your data, and what it does not.">
    <meta property="og:type" content="article">
    <meta name="theme-color" content="#d60505">
    <link rel="canonical" href="https://redstone-launcher.com/privacy">
    <link rel="icon" href="img/redstone_logo.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- The policy itself lives in the launcher's repository, because that is
         where it is kept in step with the code it describes. This page is the
         public address for it: it fetches that one file and renders it, so
         there is never a second copy to drift out of date. -->
    <style>
        .policy-wrap {
            max-width: 52rem;
            margin: 0 auto;
            padding: 7rem 1.5rem 4rem;
        }

        .policy-source {
            display: block;
            font-size: 0.82rem;
            color: var(--muted);
            text-decoration: none;
            margin-bottom: 2.5rem;
        }

        .policy-source:hover {
            color: var(--primary);
        }

        /* The rendered document. Deliberately plain: it is a legal text and
           has to be easy to read straight down, not decorated. */
        .policy h1 {
            font-size: 2.1rem;
            line-height: 1.2;
            margin: 0 0 1.2rem;
        }

        .policy h2 {
            font-size: 1.4rem;
            margin: 2.6rem 0 0.9rem;
            padding-top: 1.4rem;
            border-top: 1px solid var(--border);
        }

        .policy h3 {
            font-size: 1.08rem;
            margin: 1.8rem 0 0.6rem;
        }

        .policy p {
            margin: 0 0 1rem;
            color: var(--muted);
        }

        .policy strong {
            color: var(--foreground);
        }

        .policy a {
            color: var(--primary);
            text-decoration: underline;
            text-underline-offset: 2px;
            overflow-wrap: anywhere;
        }

        .policy ul {
            margin: 0 0 1.2rem 1.2rem;
            color: var(--muted);
        }

        .policy li {
            margin-bottom: 0.5rem;
        }

        /* The document separates its sections with rules AND headings;
           showing both doubles every divider. The headings carry it. */
        .policy hr {
            display: none;
        }

        .policy code {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            padding: 0.1em 0.38em;
            font-size: 0.88em;
            /* The scope table holds full googleapis.com URLs in code spans.
               Without this they are single unbreakable words, and on a phone
               they push the table -- and the whole page with it -- off the
               side of the screen. */
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .policy blockquote {
            margin: 0 0 1.2rem;
            padding: 0.9rem 1.1rem;
            border-left: 3px solid var(--primary);
            background: var(--glass-bg);
            border-radius: 0 8px 8px 0;
            color: var(--muted);
        }

        /* A table is the one block that cannot always be made narrow enough,
           so it scrolls inside its own box rather than widening the page. */
        .policy .table-wrap {
            max-width: 100%;
            overflow-x: auto;
            margin: 0 0 1.4rem;
            -webkit-overflow-scrolling: touch;
        }

        .policy table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        .policy th,
        .policy td {
            border: 1px solid var(--border);
            padding: 0.6rem 0.75rem;
            text-align: left;
            vertical-align: top;
            color: var(--muted);
        }

        .policy th {
            color: var(--foreground);
            background: var(--glass-bg);
        }

        /* The scope URLs are long enough to wrap inside a cell, and a bordered
           chip that wraps is drawn as several boxes with edges through the
           middle of the text. In a table the chip earns nothing anyway. */
        .policy td code,
        .policy th code {
            background: none;
            border: 0;
            padding: 0;
            color: var(--foreground);
        }

        .policy-state {
            color: var(--muted);
            padding: 2rem 0;
        }

        .policy-state a {
            color: var(--primary);
        }

        @media (max-width: 600px) {
            .policy-wrap {
                padding: 5.5rem 1rem 3rem;
            }

            .policy h1 {
                font-size: 1.7rem;
            }

            .policy th,
            .policy td {
                padding: 0.5rem 0.55rem;
            }
        }
    </style>
</head>

<body>
    <nav class="glass">
        <a class="nav-brand" href="/">
            <img src="img/redstone_logo.png" alt="Redstone Launcher Logo">
        </a>

        <!-- Filled in by site-menu.js, which holds the site's one menu. -->
        <div class="nav-center"></div>

        <div class="nav-actions">
            <button id="themeToggle" class="theme-toggle glass" aria-label="Toggle theme">
                <svg class="sun-icon" viewBox="0 0 24 24" style="display:none">
                    <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2" />
                    <path stroke="currentColor" stroke-width="2"
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-width="2" fill="none"
                        d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <button class="mobile-toggle" id="mobileToggle" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <div class="mobile-nav glass" id="mobileNav"></div>

    <div class="policy-wrap">
        <a class="policy-source" href="https://github.com/TGGamesYT/redstone-launcher/blob/main/PRIVACY.md"
            target="_blank" rel="noopener">View the source of this document on GitHub</a>

        <main class="policy" id="policy">
            <p class="policy-state" id="state">Loading the policy…</p>
            <noscript>
                <p class="policy-state">
                    This page renders the policy from the launcher's repository and needs JavaScript to do it.
                    You can read exactly the same document here:
                    <a href="https://github.com/TGGamesYT/redstone-launcher/blob/main/PRIVACY.md">PRIVACY.md</a>.
                </p>
            </noscript>
        </main>
    </div>

    <footer data-site-footer></footer>

    <script>
        // The light/dark choice is kept in localStorage by the rest of the
        // site -- under "theme" here, "rl-theme" in the help centre and the
        // archive. Read both so arriving from either does not flip the page.
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = themeToggle.querySelector('.sun-icon');
        const moonIcon = themeToggle.querySelector('.moon-icon');

        function applyTheme(theme) {
            const light = theme === 'light';
            document.documentElement.classList.toggle('light', light);
            sunIcon.style.display = light ? 'none' : 'block';
            moonIcon.style.display = light ? 'block' : 'none';
        }

        let saved = 'dark';
        try { saved = localStorage.getItem('theme') || localStorage.getItem('rl-theme') || 'dark'; } catch (e) { }
        applyTheme(saved);

        themeToggle.addEventListener('click', () => {
            const next = document.documentElement.classList.contains('light') ? 'dark' : 'light';
            applyTheme(next);
            try { localStorage.setItem('theme', next); } catch (e) { }
        });

        // ── Markdown, as much of it as this document uses ──
        //
        // Small and on purpose. A legal page that goes blank because a CDN is
        // having a bad morning is worse than one that renders a slightly
        // plainer document, so there is no third-party script here.
        //
        // Everything is escaped BEFORE any of it is turned into HTML, so a
        // fetched file can never inject markup -- the document is ours, but
        // "it is ours" is not a security model.
        const esc = (s) => s
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');

        function inline(text) {
            let out = esc(text);
            // Code first, and held aside, so nothing below reformats what is
            // inside a code span.
            const held = [];
            out = out.replace(/`([^`]+)`/g, (_, code) => {
                held.push('<code>' + code + '</code>');
                return '\u0000' + (held.length - 1) + '\u0000';
            });
            // <https://…> autolinks, which the document uses for every URL,
            // and <someone@example.com>, which markdown also autolinks and
            // which the contact address is written as. Already escaped by
            // this point, hence the entities.
            out = out.replace(/&lt;(https?:\/\/[^\s&]+|mailto:[^\s&]+|[^\s@&]+@[^\s@&]+\.[^\s@&]+)&gt;/g,
                (_, target) => {
                    const mail = !/^(https?:|mailto:)/.test(target);
                    const href = mail ? 'mailto:' + target : target;
                    const text = target.replace(/^mailto:/, '');
                    return `<a href="${href}"${mail ? '' : ' target="_blank" rel="noopener"'}>${text}</a>`;
                });
            // [text](url)
            out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
                (_, t, url) => `<a href="${url}"${/^https?:/.test(url) ? ' target="_blank" rel="noopener"' : ''}>${t}</a>`);
            out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
            return out.replace(/\u0000(\d+)\u0000/g, (_, i) => held[Number(i)]);
        }

        function render(md) {
            const lines = md.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let para = [];
            const flush = () => {
                if (para.length) out.push('<p>' + inline(para.join(' ')) + '</p>');
                para = [];
            };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (!line.trim()) { flush(); continue; }

                const h = /^(#{1,4})\s+(.*)$/.exec(line);
                if (h) { flush(); const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); continue; }

                if (/^---+\s*$/.test(line)) { flush(); out.push('<hr>'); continue; }

                // A table: a header row, a |---|---| rule, then rows. Wrapped
                // in a box of its own so that on a narrow screen the table
                // scrolls instead of the page.
                if (/^\s*\|/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
                    flush();
                    const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
                    const head = cells(line);
                    i += 2;
                    const body = [];
                    while (i < lines.length && /^\s*\|/.test(lines[i])) { body.push(cells(lines[i])); i++; }
                    i--;
                    out.push('<div class="table-wrap"><table><thead><tr>'
                        + head.map(c => `<th>${inline(c)}</th>`).join('')
                        + '</tr></thead><tbody>'
                        + body.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('')
                        + '</tbody></table></div>');
                    continue;
                }

                if (/^\s*[-*]\s+/.test(line)) {
                    flush();
                    const items = [];
                    while (i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || (items.length && /^\s{2,}\S/.test(lines[i])))) {
                        if (/^\s*[-*]\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
                        else items[items.length - 1] += ' ' + lines[i].trim();   // a wrapped item
                        i++;
                    }
                    i--;
                    out.push('<ul>' + items.map(t => `<li>${inline(t)}</li>`).join('') + '</ul>');
                    continue;
                }

                if (/^\s*>\s?/.test(line)) {
                    flush();
                    const quote = [];
                    while (i < lines.length && /^\s*>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
                    i--;
                    out.push('<blockquote>' + inline(quote.join(' ')) + '</blockquote>');
                    continue;
                }

                para.push(line.trim());
            }
            flush();
            return out.join('\n');
        }

        const SOURCE = 'https://raw.githubusercontent.com/TGGamesYT/redstone-launcher/main/PRIVACY.md';
        const ON_GITHUB = 'https://github.com/TGGamesYT/redstone-launcher/blob/main/PRIVACY.md';

        (async () => {
            const box = document.getElementById('policy');
            const state = document.getElementById('state');
            try {
                const res = await fetch(SOURCE, { cache: 'no-cache' });
                if (!res.ok) throw new Error('GitHub answered ' + res.status);
                const md = await res.text();
                if (!/privacy/i.test(md)) throw new Error('that does not look like the policy');
                box.innerHTML = render(md);
            } catch (err) {
                // Said plainly, with somewhere to go. A legal page that fails
                // silently is a legal page nobody can read.
                state.innerHTML = 'The policy could not be loaded just now ('
                    + esc(String(err && err.message || err)) + ').<br>'
                    + 'You can read exactly the same document here: '
                    + `<a href="${ON_GITHUB}" target="_blank" rel="noopener">PRIVACY.md</a>.`;
            }
        })();
    </script>
    <script src="/site-menu.js" defer></script>
</body>

</html>
